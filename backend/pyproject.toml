[project]
name = "docsage-api"
version = "0.1.0"
description = "DocSage FastAPI backend: agentic RAG document intelligence."
authors = [
    { name = "Alex Torres", email = "Alex5350@pm.me" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "python-multipart>=0.0.20",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
    "openai>=1.60",
    "google-genai>=1.0",
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.1.0",
    "reportlab>=4.2",
    "ruff>=0.9",
]

[project.scripts]
docsage-api = "docsage_api.main:run"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's canonical dependency injection is Depends(...) in defaults.
ignore = ["B008"]
